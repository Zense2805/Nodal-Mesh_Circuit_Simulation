<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EE Interactive Circuit Simulator</title>
<style>
  :root {
    --bg: #050707;
    --bottom-h: 82px;
    --grid-minor: #11201c;
    --grid-major: #1a2c27;
    --wire-off: #d6ddda;
    --wire-run: #78ff82;
    --terminal: #78ff82;
    --selected: #f3df67;
    --voltage: #8a80ff;
    --current: #7cff86;
    --danger: #ff5c52;
    --text: #e7ece9;
    --muted: #9aa5a1;
    --panel: rgba(22, 26, 25, .96);
    --panel-border: #39423f;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Inter, Arial, Helvetica, sans-serif; }
  body { overflow: hidden; }

  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: var(--bg);
  }

  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    user-select: none;
    cursor: default;
    transition: width .18s ease;
  }

  .floating-btn {
    position: absolute;
    width: 64px;
    height: 64px;
    border: 1px solid #3c4642;
    border-radius: 4px;
    background: rgba(56, 63, 60, .9);
    color: #dfe6e2;
    font-size: 50px;
    line-height: 56px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
  }
  #addBtn { left: 18px; top: 18px; }

  #palette {
    position: absolute;
    left: 18px;
    top: 92px;
    width: 230px;
    padding: 10px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    border-radius: 8px;
    box-shadow: 0 12px 30px rgba(0,0,0,.35);
    display: none;
    z-index: 20;
  }
  #palette.open { display: block; }
  .palette-title { font-weight: 700; margin: 3px 4px 10px; color: #dfe6e2; }
  .palette-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 11px;
    margin: 5px 0;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    text-align: left;
    cursor: pointer;
  }
  .palette-item:hover { background: #2b3330; border-color: #4c5753; }
  .palette-icon {
    width: 52px;
    height: 36px;
    display: grid;
    place-items: center;
  }

  .palette-icon svg {
    width: 52px;
    height: 36px;
    overflow: visible;
  }

  .palette-icon svg * {
    fill: none;
    stroke: #eef5f1;
    stroke-width: 1.8;
    vector-effect: non-scaling-stroke;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #inspector {
    position: absolute;
    right: 18px;
    top: 18px;
    width: 265px;
    max-width: calc(100vw - 36px);
    border: 1px solid var(--panel-border);
    background: var(--panel);
    border-radius: 8px;
    padding: 13px;
    box-shadow: 0 12px 30px rgba(0,0,0,.35);
    display: none;
    z-index: 20;
  }
  #inspector.open { display: block; }
  #inspector h3 { margin: 0 0 10px; font-size: 16px; }
  .field { margin-top: 10px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #4a5551;
    background: #0e1110;
    color: var(--text);
    border-radius: 5px;
    font-size: 16px;
  }
  .inspector-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .inspector-actions button, #wireDeleteBtn {
    min-height: 40px;
    border: 1px solid #4a5551;
    border-radius: 5px;
    background: #2c3431;
    color: var(--text);
    cursor: pointer;
  }
  #deleteBtn, #wireDeleteBtn { border-color: #78413e; background: #492625; }
  .measurement-card { margin-top: 12px; padding-top: 10px; border-top: 1px solid #39423f; font-family: Consolas, monospace; font-size: 13px; line-height: 1.55; }
  .measurement-card .v { color: var(--voltage); }
  .measurement-card .i { color: var(--current); }

  #status {
    position: absolute;
    left: 50%;
    top: 18px;
    transform: translateX(-50%);
    max-width: 520px;
    padding: 8px 12px;
    border: 1px solid rgba(70, 80, 76, .8);
    border-radius: 6px;
    background: rgba(12, 15, 14, .86);
    color: #aeb8b4;
    font-size: 13px;
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }
  #status.error { color: #ff7b73; border-color: #69413e; }
  #status.running { color: var(--current); }

  #bottomBar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    min-height: var(--bottom-h);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 9px 14px;
    border-top: 1px solid #353d3a;
    background: rgba(50, 54, 52, .97);
    z-index: 15;
  }

  .tool-btn {
    width: 54px;
    height: 54px;
    flex: 0 0 auto;
    border-radius: 50%;
    border: 2px solid #aeb6b2;
    background: #3a403e;
    color: #e9efec;
    display: grid;
    place-items: center;
    font-size: 25px;
    cursor: pointer;
  }

  .tool-btn:hover { background: #454c49; }
  #runBtn.running { color: var(--current); border-color: var(--current); }

  #clearBtn {
    border-radius: 8px;
    width: auto;
    min-width: 78px;
    padding: 0 14px;
    font-size: 14px;
  }

  .wire-base {
    fill: none;
    stroke: var(--wire-off);
    stroke-width: 2.2;
    stroke-linecap: square;
    stroke-linejoin: miter;
    vector-effect: non-scaling-stroke;
  }
  .wire-base.running { stroke: var(--wire-run); }
  .wire-base.selected { stroke: var(--selected); stroke-width: 3.2; }
  .wire-hit {
    fill: none;
    stroke: transparent;
    stroke-width: 18;
    pointer-events: stroke;
    cursor: pointer;
  }
  .wire-flow {
    fill: none;
    stroke: #d9ffe0;
    stroke-width: 3.3;
    stroke-linecap: round;
    stroke-dasharray: 2 15;
    vector-effect: non-scaling-stroke;
    pointer-events: none;
    animation: flowForward .8s linear infinite;
  }
  .wire-flow.reverse { animation-name: flowReverse; }
  @keyframes flowForward { to { stroke-dashoffset: -17; } }
  @keyframes flowReverse { to { stroke-dashoffset: 17; } }

  .component-hit { fill: transparent; stroke: transparent; cursor: grab; }
  .component-hit:active { cursor: grabbing; }
  .schematic-line {
    fill: none;
    stroke: #edf4f0;
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .schematic-line.running { stroke: var(--wire-run); }

  .resistor-body {
    fill: #07100d;
    stroke: #edf4f0;
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }
  .resistor-body.running { stroke: var(--wire-run); }

  .source-circle {
    fill: #06100c;
    stroke: #edf4f0;
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }
  .source-circle.running { stroke: var(--wire-run); }

  .component-label {
    fill: #f2f7f4;
    font-size: 14px;
    font-weight: 500;
    pointer-events: none;
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 4px;
  }
  .value-label {
    fill: #b7c3be;
    font-size: 13px;
    pointer-events: none;
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 4px;
  }
  .current-label {
    fill: var(--current);
    font-size: 14px;
    font-weight: 650;
    pointer-events: none;
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 4px;
  }
  .voltage-label { fill: var(--voltage); font-size: 15px; font-weight: 600; text-anchor: middle; pointer-events: none; }
  .terminal-dot { fill: var(--terminal); stroke: #0b160f; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .terminal-dot.selected-terminal { fill: var(--selected); }
  .terminal-hit { fill: transparent; stroke: transparent; stroke-width: 18; cursor: crosshair; }
  .selection-ring { fill: none; stroke: var(--selected); stroke-width: 1.5; stroke-dasharray: 5 4; pointer-events: none; vector-effect: non-scaling-stroke; }
  .node-dot { fill: var(--terminal); stroke: #0d150f; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .wire-preview { fill: none; stroke: var(--selected); stroke-width: 2; stroke-dasharray: 7 5; pointer-events: none; vector-effect: non-scaling-stroke; }


  /* =========================================================
     ANALYSIS METHOD + EDUCATIONAL SOLUTION NOTEBOOK
     ========================================================= */
  #analysisSelector {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px;
    border: 1px solid #59635f;
    border-radius: 8px;
    background: #252b29;
  }

  #analysisSelector .analysis-choice {
    min-width: 96px;
    height: 44px;
    padding: 0 12px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: #b9c3bf;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .04em;
    cursor: pointer;
  }

  #analysisSelector .analysis-choice.active {
    border-color: var(--current);
    background: #14321d;
    color: var(--current);
  }

  #solutionPanel {
    position: absolute;
    right: 0;
    top: 0;
    bottom: var(--bottom-h);
    width: clamp(360px, 32vw, 470px);
    overflow: auto;
    border-left: 1px solid var(--panel-border);
    background: rgba(14, 17, 16, .995);
    box-shadow: -10px 0 28px rgba(0,0,0,.28);
    z-index: 19;
    display: none;
  }

  #solutionPanel.open { display: block; }

  /* Desktop split-view: the circuit keeps its own readable area. */
  #app.solution-open #canvas {
    width: calc(100% - clamp(360px, 32vw, 470px));
  }

  #app.solution-open #bottomBar {
    right: clamp(360px, 32vw, 470px);
  }

  #app.solution-open #status {
    left: calc((100% - clamp(360px, 32vw, 470px)) / 2);
  }

  #app.solution-open #inspector {
    right: calc(clamp(360px, 32vw, 470px) + 18px);
  }

  .solution-head {
    position: sticky;
    top: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid #3a4541;
    background: rgba(20, 24, 22, .99);
    z-index: 2;
  }

  .solution-head strong {
    color: var(--current);
    font-size: 16px;
    letter-spacing: .01em;
  }

  #closeSolutionBtn {
    width: 34px;
    height: 34px;
    border: 1px solid #4a5551;
    border-radius: 5px;
    background: #2a312f;
    color: var(--text);
    cursor: pointer;
  }

  #solutionContent {
    padding: 16px 18px 24px;
    color: #d9dfdc;
    font-size: 14px;
    line-height: 1.68;
  }

  .solution-summary {
    margin-bottom: 12px;
    padding: 10px 11px;
    border: 1px solid #3d4944;
    border-radius: 7px;
    background: #111513;
  }

  .solution-step {
    margin-top: 13px;
    padding-top: 12px;
    border-top: 1px solid #313a36;
  }

  .worked-branch {
    margin: 10px 0;
    padding: 10px 11px;
    border-left: 3px solid #315b47;
    background: #101412;
    line-height: 1.7;
  }

  .worked-branch strong {
    color: #dfffe5;
  }

  .step-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    color: #f0f4f2;
    font-weight: 800;
  }

  .step-number {
    display: inline-grid;
    place-items: center;
    min-width: 25px;
    height: 25px;
    padding: 0 6px;
    border-radius: 999px;
    background: #173923;
    color: var(--current);
    font-family: Consolas, monospace;
    font-size: 12px;
  }

  .math-line {
    margin: 5px 0;
    padding: 7px 9px;
    border-left: 3px solid #45524d;
    background: #0b0e0d;
    color: #f0e5a0;
    font-family: "Cambria Math", Consolas, monospace;
    overflow-wrap: anywhere;
  }

  .math-line.result {
    border-left-color: var(--current);
    color: var(--current);
    font-weight: 700;
  }

  .math-line.note {
    border-left-color: var(--voltage);
    color: #b9b2ff;
  }

  .matrix-wrap {
    overflow-x: auto;
    margin: 7px 0;
  }

  .matrix-table {
    border-collapse: separate;
    border-spacing: 7px 3px;
    margin: 0 auto;
    color: #f3e7a4;
    font-family: Consolas, monospace;
  }

  .matrix-table td {
    min-width: 58px;
    padding: 4px 7px;
    text-align: right;
    border-bottom: 1px solid #38423e;
  }

  .variable-list {
    color: #aab5b0;
    font-family: Consolas, monospace;
    text-align: center;
    margin-bottom: 6px;
  }

  .answer-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 7px;
  }

  .answer-chip {
    padding: 8px 9px;
    border: 1px solid #33413a;
    border-radius: 6px;
    background: #101512;
    color: var(--current);
    font-family: Consolas, monospace;
  }

  .verification-ok { color: var(--current); }
  .verification-warn { color: var(--danger); }

  .mesh-current-arrow {
    fill: #ff79c6;
    font-size: 36px;
    font-weight: 700;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 5px;
    stroke-linejoin: round;
  }

  .mesh-loop-label {
    fill: #ffb5dd;
    font-size: 13px;
    font-weight: 800;
    text-anchor: middle;
    pointer-events: none;
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 4px;
    stroke-linejoin: round;
  }

  .nodal-node-label {
    fill: var(--voltage);
    font-size: 15px;
    font-weight: 800;
    pointer-events: none;
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 5px;
    stroke-linejoin: round;
  }

  @media (max-width: 900px) {
    #analysisSelector .analysis-choice { min-width: 72px; padding: 0 7px; font-size: 10px; }
    #solutionPanel {
      left: 8px;
      right: 8px;
      top: auto;
      bottom: 72px;
      width: auto;
      max-height: 48vh;
      border: 1px solid var(--panel-border);
      border-radius: 9px 9px 0 0;
    }
    #app.solution-open #canvas { width: 100%; }
    #app.solution-open #bottomBar { right: 0; }
    #app.solution-open #status { left: 50%; }
    #app.solution-open #inspector { right: 8px; }
    .answer-grid { grid-template-columns: 1fr; }
  }


  #viewControls {
    position: absolute;
    right: 18px;
    bottom: calc(var(--bottom-h) + 16px);
    display: flex;
    flex-direction: column;
    gap: 7px;
    z-index: 16;
  }

  #viewControls button {
    width: 44px;
    height: 44px;
    border: 1px solid #58635f;
    border-radius: 8px;
    background: rgba(34, 40, 38, .94);
    color: #edf4f0;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
  }

  #viewControls #fitViewBtn {
    font-size: 11px;
    letter-spacing: .03em;
  }

  #app.solution-open #viewControls {
    right: calc(clamp(360px, 32vw, 470px) + 18px);
  }

  #solutionToggleBtn {
    position: absolute;
    right: 18px;
    top: 18px;
    min-width: 104px;
    height: 38px;
    padding: 0 12px;
    border: 1px solid #4d5a54;
    border-radius: 7px;
    background: rgba(25, 31, 28, .95);
    color: var(--current);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .04em;
    cursor: pointer;
    z-index: 17;
    display: none;
  }

  #solutionToggleBtn.available { display: block; }

  #app.solution-open #solutionToggleBtn { display: none; }

  .pan-cursor { cursor: grabbing !important; }

  @media (prefers-reduced-motion: reduce) {
    .wire-flow { animation: none; }
  }


  /* ==========================================================
     MOBILE / IN-APP BROWSER LAYOUT
     ========================================================== */
  @media (max-width: 900px) {
    :root { --bottom-h: 112px; }

    #app {
      overflow: hidden;
    }

    #canvas,
    #app.solution-open #canvas {
      width: 100% !important;
      height: 100% !important;
    }

    #addBtn {
      left: 10px;
      top: 10px;
      width: 52px;
      height: 52px;
      font-size: 38px;
      line-height: 46px;
    }

    #palette {
      left: 10px;
      top: 70px;
      width: min(220px, calc(100vw - 20px));
    }

    #status {
      top: 10px;
      left: 50% !important;
      transform: translateX(-50%);
      width: auto;
      max-width: calc(100vw - 150px);
      padding: 6px 10px;
      font-size: 11px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #bottomBar,
    #app.solution-open #bottomBar {
      left: 0;
      right: 0 !important;
      bottom: 0;
      width: 100%;
      max-width: 100%;
      min-height: var(--bottom-h);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: 48px 48px;
      align-items: center;
      justify-items: center;
      gap: 6px 8px;
      padding: 6px 8px;
      overflow: hidden;
    }

    #analysisSelector {
      grid-column: 1 / 3;
      grid-row: 1;
      width: 100%;
      height: 46px;
      min-width: 0;
      justify-self: stretch;
    }

    #analysisSelector .analysis-choice {
      flex: 1 1 0;
      min-width: 0;
      width: 50%;
      height: 44px;
      padding: 0 4px;
      font-size: 10px;
    }

    #runBtn {
      grid-column: 3;
      grid-row: 1;
    }

    #undoBtn {
      grid-column: 4;
      grid-row: 1;
    }

    #rotateBottomBtn {
      grid-column: 1;
      grid-row: 2;
    }

    #deleteBottomBtn {
      grid-column: 2;
      grid-row: 2;
    }

    #clearBtn {
      grid-column: 3 / 5;
      grid-row: 2;
      width: 100%;
      min-width: 0;
      max-width: none;
      height: 44px;
      border-radius: 8px;
      padding: 0 8px;
      font-size: 12px;
    }

    .tool-btn {
      width: 44px;
      height: 44px;
      font-size: 21px;
    }

    #viewControls,
    #app.solution-open #viewControls {
      right: 10px;
      bottom: calc(var(--bottom-h) + 10px);
      gap: 6px;
    }

    #viewControls button {
      width: 42px;
      height: 42px;
      font-size: 19px;
    }

    #viewControls #fitViewBtn {
      font-size: 10px;
    }

    #solutionToggleBtn {
      right: 10px;
      top: 68px;
      height: 38px;
      min-width: 92px;
      font-size: 11px;
    }

    #solutionPanel {
      left: 8px;
      right: 8px;
      top: 56px;
      bottom: calc(var(--bottom-h) + 8px);
      width: auto;
      max-height: none;
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      box-shadow: 0 12px 34px rgba(0,0,0,.5);
    }

    #solutionContent {
      padding: 14px 14px 24px;
      font-size: 14px;
      line-height: 1.62;
    }

    .solution-head {
      padding: 11px 12px;
    }

    .solution-head strong {
      font-size: 15px;
    }

    .answer-grid {
      grid-template-columns: 1fr;
    }

    #inspector,
    #app.solution-open #inspector {
      right: 8px;
      top: 116px;
      width: min(248px, calc(100vw - 16px));
      max-height: calc(100% - var(--bottom-h) - 130px);
      overflow: auto;
    }
  }

  @media (max-width: 420px) {
    :root { --bottom-h: 108px; }

    #bottomBar,
    #app.solution-open #bottomBar {
      grid-template-rows: 46px 46px;
      gap: 5px 6px;
      padding: 5px 6px;
    }

    .tool-btn {
      width: 40px;
      height: 40px;
      font-size: 19px;
    }

    #analysisSelector {
      height: 42px;
    }

    #analysisSelector .analysis-choice {
      height: 40px;
      font-size: 9px;
    }

    #clearBtn {
      height: 40px;
    }

    #viewControls button {
      width: 39px;
      height: 39px;
    }

    #status {
      max-width: calc(100vw - 132px);
      font-size: 10px;
    }
  }

</style>
</head>
<body>
<div id="app">
  <svg id="canvas" aria-label="Interactive DC circuit workspace">
    <defs>
      <pattern id="minorGrid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="var(--grid-minor)" stroke-width="1" />
      </pattern>
      <pattern id="majorGrid" width="120" height="120" patternUnits="userSpaceOnUse">
        <rect width="120" height="120" fill="url(#minorGrid)" />
        <path d="M 120 0 L 0 0 0 120" fill="none" stroke="var(--grid-major)" stroke-width="1.2" />
        <circle cx="0" cy="0" r="3.3" fill="#17241f" />
      </pattern>
    </defs>
    <rect id="gridRect" x="0" y="0" width="100%" height="100%" fill="url(#majorGrid)" />
    <g id="viewportLayer">
      <g id="wireLayer"></g>
      <g id="componentLayer"></g>
      <g id="overlayLayer"></g>
    </g>
  </svg>

  <button id="addBtn" class="floating-btn" title="Add component" aria-label="Add component">+</button>

  <div id="palette">
    <div class="palette-title">Add component</div>
    <button class="palette-item" data-add="resistor">
      <span class="palette-icon">
        <svg viewBox="0 0 52 32" aria-hidden="true">
          <line x1="2" y1="16" x2="12" y2="16"/>
          <rect x="12" y="8" width="28" height="16" rx="1"/>
          <line x1="40" y1="16" x2="50" y2="16"/>
        </svg>
      </span>
      <span>Resistor</span>
    </button>
    <button class="palette-item" data-add="voltage">
      <span class="palette-icon">
        <svg viewBox="0 0 52 36" aria-hidden="true">
          <line x1="26" y1="1" x2="26" y2="7"/>
          <circle cx="26" cy="18" r="11"/>
          <line x1="26" y1="29" x2="26" y2="35"/>
          <line x1="21" y1="14" x2="31" y2="14"/>
          <line x1="26" y1="9" x2="26" y2="19"/>
          <line x1="21" y1="23" x2="31" y2="23"/>
        </svg>
      </span>
      <span>Voltage Source</span>
    </button>
    <button class="palette-item" data-add="ground">
      <span class="palette-icon">
        <svg viewBox="0 0 52 36" aria-hidden="true">
          <line x1="26" y1="2" x2="26" y2="16"/>
          <line x1="13" y1="16" x2="39" y2="16"/>
          <line x1="18" y1="22" x2="34" y2="22"/>
          <line x1="22" y1="28" x2="30" y2="28"/>
        </svg>
      </span>
      <span>Ground</span>
    </button>
  </div>

  <div id="status">Drag parts • terminal → terminal to wire • drag empty grid to pan</div>

  <aside id="inspector" aria-live="polite"></aside>

  <aside id="solutionPanel" aria-live="polite">
    <div class="solution-head">
      <strong id="solutionTitle">Nodal Analysis Solution</strong>
      <button id="closeSolutionBtn" type="button" aria-label="Close solution">✕</button>
    </div>
    <div id="solutionContent"></div>
  </aside>

  <button id="solutionToggleBtn" type="button" aria-label="Show complete solution">SOLUTION</button>

  <div id="viewControls" aria-label="Circuit view controls">
    <button id="zoomInBtn" type="button" title="Zoom in" aria-label="Zoom in">+</button>
    <button id="zoomOutBtn" type="button" title="Zoom out" aria-label="Zoom out">−</button>
    <button id="fitViewBtn" type="button" title="Fit circuit to screen" aria-label="Fit circuit to screen">FIT</button>
  </div>

  <div id="bottomBar">
    <div id="analysisSelector" role="group" aria-label="Analysis method">
      <button class="analysis-choice active" data-analysis-method="nodal" type="button">NODAL</button>
      <button class="analysis-choice" data-analysis-method="mesh" type="button">MESH</button>
    </div>
    <button id="runBtn" class="tool-btn" title="Run / Pause" aria-label="Run or pause">▶</button>
    <button id="undoBtn" class="tool-btn" title="Undo" aria-label="Undo">↶</button>
    <button id="rotateBottomBtn" class="tool-btn" title="Rotate selected component" aria-label="Rotate selected component">↻</button>
    <button id="deleteBottomBtn" class="tool-btn" title="Delete selected item" aria-label="Delete selected item">⌫</button>
    <button id="clearBtn" class="tool-btn" title="Clear workspace">CLEAR</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  const SVG_NS = 'http://www.w3.org/2000/svg';
  const GRID = 24;

  const canvas = document.getElementById('canvas');
  const viewportLayer = document.getElementById('viewportLayer');
  const wireLayer = document.getElementById('wireLayer');
  const componentLayer = document.getElementById('componentLayer');
  const overlayLayer = document.getElementById('overlayLayer');
  const palette = document.getElementById('palette');
  const inspector = document.getElementById('inspector');
  const statusEl = document.getElementById('status');
  const runBtn = document.getElementById('runBtn');
  const solutionPanel = document.getElementById('solutionPanel');
  const solutionTitle = document.getElementById('solutionTitle');
  const solutionContent = document.getElementById('solutionContent');
  const analysisSelector = document.getElementById('analysisSelector');
  const solutionToggleBtn = document.getElementById('solutionToggleBtn');
  const viewControls = document.getElementById('viewControls');

  const state = {
    components: [],
    wires: [],
    selected: null,
    running: false,
    measurements: null,
    analysisMethod: 'nodal',
    analysisData: null,
    drag: null,
    wireDrag: null,
    pointer: { x: 0, y: 0 },
    nextComponent: 1,
    nextWire: 1,
    history: [],
    view: {
      zoom: 1,
      panX: 0,
      panY: 0,
      userAdjusted: false
    },
    panDrag: null,
    activePointers: new Map(),
    pinch: null
  };

  const snap = value => Math.round(value / GRID) * GRID;
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

  function applyViewportTransform() {
    viewportLayer.setAttribute(
      'transform',
      `translate(${state.view.panX} ${state.view.panY}) scale(${state.view.zoom})`
    );
  }

  function screenPoint(eventOrX, maybeY) {
    const rect = canvas.getBoundingClientRect();

    if (typeof eventOrX === 'object') {
      return {
        x: eventOrX.clientX - rect.left,
        y: eventOrX.clientY - rect.top
      };
    }

    return {
      x: eventOrX - rect.left,
      y: maybeY - rect.top
    };
  }

  function screenToWorld(x, y) {
    return {
      x: (x - state.view.panX) / state.view.zoom,
      y: (y - state.view.panY) / state.view.zoom
    };
  }

  function zoomAtScreenPoint(nextZoom, screenX, screenY, markAdjusted = true) {
    const oldZoom = state.view.zoom;
    nextZoom = clamp(nextZoom, 0.35, 3.5);
    if (Math.abs(nextZoom - oldZoom) < 1e-9) return;

    const world = screenToWorld(screenX, screenY);
    state.view.zoom = nextZoom;
    state.view.panX = screenX - world.x * nextZoom;
    state.view.panY = screenY - world.y * nextZoom;
    if (markAdjusted) state.view.userAdjusted = true;
    applyViewportTransform();
  }

  function circuitBounds() {
    if (!state.components.length) return null;

    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

    state.components.forEach(component => {
      const pad = component.type === 'ground' ? 70 : 86;
      minX = Math.min(minX, component.x - pad);
      maxX = Math.max(maxX, component.x + pad);
      minY = Math.min(minY, component.y - pad);
      maxY = Math.max(maxY, component.y + pad);

      componentTerminalRefs(component).forEach(ref => {
        const p = terminalPosition(ref);
        if (!p) return;
        minX = Math.min(minX, p.x);
        maxX = Math.max(maxX, p.x);
        minY = Math.min(minY, p.y);
        maxY = Math.max(maxY, p.y);
      });
    });

    return { minX, minY, maxX, maxY };
  }

  function fitCircuit(markAdjusted = false) {
    const bounds = circuitBounds();
    if (!bounds) return;

    const bottomBar = document.getElementById('bottomBar');
    const usableWidth = Math.max(220, canvas.clientWidth);
    const usableHeight = Math.max(
      220,
      canvas.clientHeight - (bottomBar?.offsetHeight || 82)
    );

    const width = Math.max(140, bounds.maxX - bounds.minX);
    const height = Math.max(140, bounds.maxY - bounds.minY);

    const mobile = window.innerWidth <= 900;
    const padX = mobile ? 24 : 110;
    const padY = mobile ? 52 : 105;
    const maxZoom = mobile ? 2.15 : 2.25;

    const zoom = clamp(
      Math.min(
        (usableWidth - padX * 2) / width,
        (usableHeight - padY * 2) / height
      ),
      0.45,
      maxZoom
    );

    const centerX = (bounds.minX + bounds.maxX) / 2;
    const centerY = (bounds.minY + bounds.maxY) / 2;

    state.view.zoom = zoom;
    state.view.panX = usableWidth / 2 - centerX * zoom;
    state.view.panY =
      usableHeight / 2 - centerY * zoom + (mobile ? -6 : 18);
    state.view.userAdjusted = markAdjusted;
    applyViewportTransform();
  }

  function isMobileLayout() {
    return window.matchMedia('(max-width: 900px)').matches;
  }

  function pointerPair() {
    return [...state.activePointers.values()].slice(0, 2);
  }

  function pairCenter(pair) {
    return {
      x: (pair[0].x + pair[1].x) / 2,
      y: (pair[0].y + pair[1].y) / 2
    };
  }

  function pairDistance(pair) {
    return Math.hypot(
      pair[1].x - pair[0].x,
      pair[1].y - pair[0].y
    );
  }

  function beginPinchIfReady() {
    if (state.activePointers.size < 2) return false;

    const pair = pointerPair();
    const center = pairCenter(pair);
    const distance = Math.max(1, pairDistance(pair));

    state.drag = null;
    state.wireDrag = null;
    state.panDrag = null;

    state.pinch = {
      startDistance: distance,
      startZoom: state.view.zoom,
      startPanX: state.view.panX,
      startPanY: state.view.panY,
      startCenter: center,
      worldX: (center.x - state.view.panX) / state.view.zoom,
      worldY: (center.y - state.view.panY) / state.view.zoom
    };

    state.view.userAdjusted = true;
    canvas.classList.add('pan-cursor');
    return true;
  }

  function updatePinch() {
    if (!state.pinch || state.activePointers.size < 2) return;

    const pair = pointerPair();
    const center = pairCenter(pair);
    const distance = Math.max(1, pairDistance(pair));

    const zoom = clamp(
      state.pinch.startZoom *
      (distance / state.pinch.startDistance),
      0.35,
      3.5
    );

    state.view.zoom = zoom;
    state.view.panX =
      center.x - state.pinch.worldX * zoom;
    state.view.panY =
      center.y - state.pinch.worldY * zoom;

    applyViewportTransform();
  }

  function svg(tag, attrs = {}) {
    const el = document.createElementNS(SVG_NS, tag);
    Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
    return el;
  }

  function setStatus(message, type = '') {
    statusEl.textContent = message;
    statusEl.className = type;
  }

  function snapshot() {
    state.history.push(JSON.stringify({
      components: state.components,
      wires: state.wires,
      nextComponent: state.nextComponent,
      nextWire: state.nextWire
    }));
    if (state.history.length > 50) state.history.shift();
  }

  function undo() {
    const item = state.history.pop();
    if (!item) return;
    const old = JSON.parse(item);
    state.components = old.components;
    state.wires = old.wires;
    state.nextComponent = old.nextComponent;
    state.nextWire = old.nextWire;
    renumberVoltageSources();
    state.selected = null;
    stopSimulation(false);
    render();
    setStatus('Undo complete.');
  }

  function componentName(type) {
    if (type === 'voltage') return 'Vs';
    const prefix = type === 'resistor' ? 'R' : 'GND';
    const count = state.components.filter(c => c.type === type).length + 1;
    return prefix + count;
  }

  function renumberVoltageSources() {
    const sources = state.components.filter(c => c.type === 'voltage');

    if (sources.length === 1) {
      sources[0].name = 'Vs';
      return;
    }

    sources.forEach((source, index) => {
      source.name = `Vs${index + 1}`;
    });
  }

  function addComponent(type, x = null, y = null) {
    snapshot();

    if (x === null || y === null) {
      const bottomBar = document.getElementById('bottomBar');
      const visibleCenter = screenToWorld(
        canvas.clientWidth / 2,
        (canvas.clientHeight - (bottomBar?.offsetHeight || 82)) / 2
      );
      x = visibleCenter.x;
      y = visibleCenter.y;
    }

    const component = {
      id: `c${state.nextComponent++}`,
      type,
      name: componentName(type),
      value: type === 'resistor' ? 1000 : type === 'voltage' ? 1 : 0,
      x: snap(clamp(x, -5000, 5000)),
      y: snap(clamp(y, -5000, 5000)),
      rotation: 0
    };
    state.components.push(component);
    renumberVoltageSources();
    state.selected = { kind: 'component', id: component.id };
    stopSimulation(false);
    render();
    palette.classList.remove('open');
    setStatus(`${component.type === 'voltage' ? 'Voltage source' : component.name} added. Drag it into position.`);
  }

  function getComponent(id) {
    return state.components.find(c => c.id === id) || null;
  }

  function rotatePoint(x, y, degrees) {
    const r = degrees * Math.PI / 180;
    return {
      x: x * Math.cos(r) - y * Math.sin(r),
      y: x * Math.sin(r) + y * Math.cos(r)
    };
  }

  function localTerminals(component) {
    if (component.type === 'resistor') {
      return [
        { key: 'a', x: -60, y: 0 },
        { key: 'b', x: 60, y: 0 }
      ];
    }
    if (component.type === 'voltage') {
      return [
        { key: 'positive', x: 0, y: -60 },
        { key: 'negative', x: 0, y: 60 }
      ];
    }
    return [{ key: 'gnd', x: 0, y: -48 }];
  }

  function terminalRef(componentId, key) {
    return `${componentId}:${key}`;
  }

  function parseTerminal(ref) {
    const split = ref.lastIndexOf(':');
    return { componentId: ref.slice(0, split), key: ref.slice(split + 1) };
  }

  function terminalPosition(ref) {
    const { componentId, key } = parseTerminal(ref);
    const c = getComponent(componentId);
    if (!c) return null;
    const local = localTerminals(c).find(t => t.key === key);
    if (!local) return null;
    const rotated = rotatePoint(local.x, local.y, c.rotation || 0);
    return { x: c.x + rotated.x, y: c.y + rotated.y };
  }

  function componentTerminalRefs(component) {
    return localTerminals(component).map(t => terminalRef(component.id, t.key));
  }

  function routeWire(a, b) {
    if (Math.abs(a.x - b.x) < 1) return [{ x: a.x, y: a.y }, { x: a.x, y: b.y }];
    if (Math.abs(a.y - b.y) < 1) return [{ x: a.x, y: a.y }, { x: b.x, y: a.y }];

    const dx = Math.abs(b.x - a.x);
    const dy = Math.abs(b.y - a.y);
    if (dx >= dy) {
      const midX = snap((a.x + b.x) / 2);
      return [
        { x: a.x, y: a.y },
        { x: midX, y: a.y },
        { x: midX, y: b.y },
        { x: b.x, y: b.y }
      ];
    }
    const midY = snap((a.y + b.y) / 2);
    return [
      { x: a.x, y: a.y },
      { x: a.x, y: midY },
      { x: b.x, y: midY },
      { x: b.x, y: b.y }
    ];
  }

  function pointsString(points) {
    return points.map(p => `${p.x},${p.y}`).join(' ');
  }

  function connectTerminals(a, b) {
    if (!a || !b || a === b) return;
    const exists = state.wires.some(w => (w.a === a && w.b === b) || (w.a === b && w.b === a));
    if (exists) {
      setStatus('Those terminals are already connected.');
      return;
    }
    snapshot();
    state.wires.push({ id: `w${state.nextWire++}`, a, b });
    state.selected = { kind: 'wire', id: state.wires[state.wires.length - 1].id };
    stopSimulation(false);
    render();
    setStatus('Wire connected.');
  }

  function isSelected(kind, id) {
    return state.selected && state.selected.kind === kind && state.selected.id === id;
  }

  function render() {
    applyViewportTransform();
    wireLayer.innerHTML = '';
    componentLayer.innerHTML = '';
    overlayLayer.innerHTML = '';
    renderWires();
    renderComponents();
    if (state.running && state.measurements) {
      renderNodeVoltages();
      if (state.analysisMethod === 'mesh' && state.analysisData?.cycles) renderMeshOverlays();
    }
    if (state.wireDrag) renderWirePreview();
    renderInspector();
  }

  function renderWires() {
    state.wires.forEach(wire => {
      const a = terminalPosition(wire.a);
      const b = terminalPosition(wire.b);
      if (!a || !b) return;
      const points = routeWire(a, b);

      const base = svg('polyline', {
        points: pointsString(points),
        class: `wire-base${state.running ? ' running' : ''}${isSelected('wire', wire.id) ? ' selected' : ''}`
      });
      wireLayer.appendChild(base);

      if (state.running && state.measurements) {
        const info = getWireFlowInfo(wire);
        if (info && Math.abs(info.current) > 1e-12) {
          const flow = svg('polyline', {
            points: pointsString(points),
            class: `wire-flow${info.current < 0 ? ' reverse' : ''}`
          });
          const mag = Math.abs(info.current);
          const duration = clamp(1.15 - Math.log10(1 + mag * 1000) * 0.22, 0.28, 1.15);
          flow.style.animationDuration = `${duration}s`;
          wireLayer.appendChild(flow);
        }
      }

      const hit = svg('polyline', {
        points: pointsString(points),
        class: 'wire-hit',
        'data-wire-id': wire.id
      });
      wireLayer.appendChild(hit);
    });
  }


  function componentLabelLayout(component) {
    const rotation = ((component.rotation || 0) % 360 + 360) % 360;

    if (component.type === 'resistor') {
      const vertical = rotation === 90 || rotation === 270;

      return vertical
        ? {
            name:    { x: 35, y: -8,  anchor: 'start' },
            value:   { x: 35, y: 12,  anchor: 'start' },
            current: { x: -38, y: 5,  anchor: 'middle' }
          }
        : {
            name:    { x: 0, y: -19, anchor: 'middle' },
            value:   { x: 0, y: 27,  anchor: 'middle' },
            current: { x: 0, y: 47,  anchor: 'middle' }
          };
    }

    if (component.type === 'voltage') {
      const horizontal = rotation === 90 || rotation === 270;

      return horizontal
        ? {
            name:    { x: 0, y: -42, anchor: 'middle' },
            current: { x: 0, y: 44,  anchor: 'middle' }
          }
        : {
            name:    { x: 40, y: 5,   anchor: 'start' },
            current: { x: -43, y: 5,  anchor: 'middle' }
          };
    }

    return {
      name: { x: 0, y: -56, anchor: 'middle' },
      current: { x: 0, y: 0, anchor: 'middle' }
    };
  }

  function renderComponents() {
    state.components.forEach(component => {
      const root = svg('g', { 'data-component-id': component.id });
      root.setAttribute('transform', `translate(${component.x} ${component.y})`);

      const selected = isSelected('component', component.id);
      const measurement = state.measurements?.components?.[component.id];

      if (selected) {
        root.appendChild(svg('rect', {
          x: -68, y: -68, width: 136, height: 136, rx: 7,
          class: 'selection-ring'
        }));
      }

      const symbol = svg('g', { transform: `rotate(${component.rotation || 0})` });
      const lineClass = `schematic-line${state.running ? ' running' : ''}`;

      if (component.type === 'resistor') drawResistor(symbol, lineClass);
      if (component.type === 'voltage') drawVoltageSource(symbol, state.running);
      if (component.type === 'ground') drawGround(symbol, lineClass);
      root.appendChild(symbol);

      const hit = svg('rect', {
        x: -66, y: -58, width: 132, height: 116,
        class: 'component-hit',
        'data-component-id': component.id
      });
      root.appendChild(hit);

      const layout = componentLabelLayout(component);

      // Ground is already identified by the standard ground symbol and by
      // the GND = 0 V node label, so do not print "GND1", "GND2", etc.
      if (component.type !== 'ground') {
        const name = svg('text', {
          x: layout.name.x,
          y: layout.name.y,
          class: 'component-label',
          'text-anchor': layout.name.anchor
        });

        // A voltage source displays only its GIVEN value: 1 V, 12 V, etc.
        name.textContent = component.type === 'voltage'
          ? `${formatNumber(component.value)} V`
          : component.name;
        root.appendChild(name);
      }

      if (component.type === 'resistor') {
        const value = svg('text', {
          x: layout.value.x,
          y: layout.value.y,
          class: 'value-label',
          'text-anchor': layout.value.anchor
        });
        value.textContent = formatResistance(component.value);
        root.appendChild(value);
      }

      // Never show a meaningless 0 nA current label on the ground symbol.
      if (state.running && measurement && component.type !== 'ground') {
        const current = svg('text', {
          x: layout.current.x,
          y: layout.current.y,
          class: 'current-label',
          'text-anchor': layout.current.anchor
        });
        current.textContent =
          `${componentCurrentArrow(component, measurement.current)} ` +
          `${formatCurrent(Math.abs(measurement.current))}`;
        root.appendChild(current);
      }

      componentLayer.appendChild(root);

      localTerminals(component).forEach(t => {
        const ref = terminalRef(component.id, t.key);
        const pos = terminalPosition(ref);
        if (!pos) return;
        const dot = svg('rect', {
          x: pos.x - 4, y: pos.y - 4, width: 8, height: 8,
          class: `terminal-dot${state.wireDrag?.start === ref ? ' selected-terminal' : ''}`,
          'data-terminal-ref': ref
        });
        overlayLayer.appendChild(dot);
        const terminalHit = svg('circle', {
          cx: pos.x, cy: pos.y, r: 13,
          class: 'terminal-hit',
          'data-terminal-ref': ref
        });
        overlayLayer.appendChild(terminalHit);
      });

    });

    renderJunctionDots();
  }

  function drawResistor(group, lineClass) {
    group.appendChild(svg('line', {
      x1: -60, y1: 0, x2: -28, y2: 0,
      class: lineClass
    }));

    const body = svg('rect', {
      x: -28, y: -10,
      width: 56, height: 20,
      rx: 1,
      class: `resistor-body${state.running ? ' running' : ''}`
    });
    group.appendChild(body);

    group.appendChild(svg('line', {
      x1: 28, y1: 0, x2: 60, y2: 0,
      class: lineClass
    }));
  }

  function drawVoltageSource(group, running) {
    const lineClass = `schematic-line${running ? ' running' : ''}`;
    const circleClass = `source-circle${running ? ' running' : ''}`;

    group.appendChild(svg('line', { x1: 0, y1: -60, x2: 0, y2: -26, class: lineClass }));
    group.appendChild(svg('line', { x1: 0, y1: 26, x2: 0, y2: 60, class: lineClass }));
    group.appendChild(svg('circle', { cx: 0, cy: 0, r: 26, class: circleClass }));

    // Plus near the upper half.
    group.appendChild(svg('line', { x1: -7, y1: -9, x2: 7, y2: -9, class: lineClass }));
    group.appendChild(svg('line', { x1: 0, y1: -16, x2: 0, y2: -2, class: lineClass }));

    // Minus near the lower half.
    group.appendChild(svg('line', { x1: -7, y1: 10, x2: 7, y2: 10, class: lineClass }));
  }

  function drawGround(group, lineClass) {
    group.appendChild(svg('line', { x1: 0, y1: -48, x2: 0, y2: -10, class: lineClass }));
    group.appendChild(svg('line', { x1: -24, y1: -10, x2: 24, y2: -10, class: lineClass }));
    group.appendChild(svg('line', { x1: -16, y1: -2, x2: 16, y2: -2, class: lineClass }));
    group.appendChild(svg('line', { x1: -8, y1: 6, x2: 8, y2: 6, class: lineClass }));
  }

  function renderJunctionDots() {
    const count = new Map();
    state.wires.forEach(w => {
      count.set(w.a, (count.get(w.a) || 0) + 1);
      count.set(w.b, (count.get(w.b) || 0) + 1);
    });
    count.forEach((n, ref) => {
      if (n < 2) return;
      const p = terminalPosition(ref);
      if (!p) return;
      overlayLayer.appendChild(svg('circle', { cx: p.x, cy: p.y, r: 6, class: 'node-dot' }));
    });
  }

  function nodeWireLabelAnchor(node, measurements) {
    // Ground label: anchor it beside the actual ground symbol.
    if (node.root === measurements.groundRoot) {
      const ground = state.components.find(component =>
        component.type === 'ground' &&
        terminalRoot(terminalRef(component.id, 'gnd'), measurements) === node.root
      );

      if (ground) {
        return {
          x: ground.x + 54,
          y: ground.y - 58,
          anchor: 'start'
        };
      }
    }

    // For a normal node, place the label at the midpoint of the longest
    // wire segment belonging to that node. This usually gives empty space
    // between components rather than putting V1 directly over R1.
    let best = null;

    state.wires.forEach(wire => {
      const rootA = terminalRoot(wire.a, measurements);
      const rootB = terminalRoot(wire.b, measurements);
      if (rootA !== node.root || rootB !== node.root) return;

      const a = terminalPosition(wire.a);
      const b = terminalPosition(wire.b);
      if (!a || !b) return;

      const points = routeWire(a, b);
      for (let i = 0; i < points.length - 1; i++) {
        const p1 = points[i];
        const p2 = points[i + 1];
        const length = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        if (!best || length > best.length) {
          best = { p1, p2, length };
        }
      }
    });

    if (best) {
      const horizontal =
        Math.abs(best.p2.x - best.p1.x) >=
        Math.abs(best.p2.y - best.p1.y);

      return horizontal
        ? {
            x: (best.p1.x + best.p2.x) / 2,
            y: best.p1.y - 15,
            anchor: 'middle'
          }
        : {
            x: best.p1.x + 16,
            y: (best.p1.y + best.p2.y) / 2 - 4,
            anchor: 'start'
          };
    }

    // Fallback for an isolated node.
    const points = node.points || [];
    if (points.length) {
      return {
        x: points.reduce((sum, p) => sum + p.x, 0) / points.length,
        y: points.reduce((sum, p) => sum + p.y, 0) / points.length - 16,
        anchor: 'middle'
      };
    }

    return { x: 20, y: 20, anchor: 'start' };
  }

  function renderNodeVoltages() {
    const measurements = state.measurements;
    const nodes = measurements?.nodes || [];

    nodes.forEach(node => {
      const anchor = nodeWireLabelAnchor(node, measurements);
      const label = svg('text', {
        x: anchor.x,
        y: anchor.y,
        class: 'nodal-node-label',
        'text-anchor': anchor.anchor
      });

      if (node.root === measurements.groundRoot) {
        label.textContent = 'GND = 0 V';
      } else {
        const index = measurements.nodeIndex.get(node.root);
        label.textContent =
          `V${index + 1} = ${formatVoltage(node.voltage)}`;
      }

      overlayLayer.appendChild(label);
    });
  }


  function componentCurrentArrow(component, current) {
    if (!component || component.type === 'ground' || !Number.isFinite(current)) return '';
    const terminals = localTerminals(component);
    if (terminals.length < 2) return '';
    const a = rotatePoint(terminals[0].x, terminals[0].y, component.rotation || 0);
    const b = rotatePoint(terminals[1].x, terminals[1].y, component.rotation || 0);
    let dx = b.x - a.x;
    let dy = b.y - a.y;
    if (current < 0) { dx *= -1; dy *= -1; }
    if (Math.abs(dx) >= Math.abs(dy)) return dx >= 0 ? '→' : '←';
    return dy >= 0 ? '↓' : '↑';
  }

  function polygonCentroid(points) {
    if (!points || points.length < 3) {
      if (!points?.length) return { x: canvas.clientWidth / 2, y: canvas.clientHeight / 2 };
      return {
        x: points.reduce((s, p) => s + p.x, 0) / points.length,
        y: points.reduce((s, p) => s + p.y, 0) / points.length
      };
    }

    let twiceArea = 0;
    let cx = 0;
    let cy = 0;

    for (let i = 0; i < points.length; i++) {
      const a = points[i];
      const b = points[(i + 1) % points.length];
      const cross = a.x * b.y - b.x * a.y;
      twiceArea += cross;
      cx += (a.x + b.x) * cross;
      cy += (a.y + b.y) * cross;
    }

    if (Math.abs(twiceArea) < 1e-9) {
      return {
        x: points.reduce((s, p) => s + p.x, 0) / points.length,
        y: points.reduce((s, p) => s + p.y, 0) / points.length
      };
    }

    return {
      x: cx / (3 * twiceArea),
      y: cy / (3 * twiceArea)
    };
  }

  function renderMeshOverlays() {
    const cycles = state.analysisData?.cycles || [];
    if (!cycles.length) return;

    cycles.forEach((cycle, index) => {
      const pts = cycle.visualPoints || [];
      const center = polygonCentroid(pts);

      const x = clamp(center.x, 42, canvas.clientWidth - 42);
      const y = clamp(center.y, 70, canvas.clientHeight - 120);

      const current = state.analysisData.meshCurrents?.[index];
      const clockwise = !Number.isFinite(current) || current >= 0;
      const arrow = clockwise ? '↻' : '↺';

      const arrowText = svg('text', {
        x,
        y,
        class: 'mesh-current-arrow'
      });
      arrowText.textContent = arrow;
      overlayLayer.appendChild(arrowText);

      const label = svg('text', {
        x,
        y: y + 34,
        class: 'mesh-loop-label'
      });
      label.textContent = Number.isFinite(current)
        ? `I${index + 1} = ${formatCurrent(Math.abs(current))}`
        : `I${index + 1}`;
      overlayLayer.appendChild(label);
    });
  }

  function matrixHtml(matrix, vector, variables) {
    const rows = matrix.map((row, r) => {
      const cells = row.map(value => `<td>${formatMatrixNumber(value)}</td>`).join('');
      return `<tr>${cells}<td style="color:#7f8b86">│</td><td>${formatMatrixNumber(vector[r])}</td></tr>`;
    }).join('');

    return `
      <div class="variable-list">Unknown vector: [ ${variables.join(' , ')} ]ᵀ</div>
      <div class="matrix-wrap">
        <table class="matrix-table" aria-label="Linear equation matrix">
          ${rows}
        </table>
      </div>
    `;
  }

  function superscriptInteger(value) {
    const map = {
      '-': '⁻', '+': '⁺',
      '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴',
      '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹'
    };
    return String(value).split('').map(ch => map[ch] || ch).join('');
  }

  function scientificText(value, digits = 3) {
    if (!Number.isFinite(value) || Math.abs(value) < 1e-15) return '0';
    const exponent = Math.floor(Math.log10(Math.abs(value)));
    const mantissa = value / Math.pow(10, exponent);
    return `${Number(mantissa.toFixed(digits))} × 10${superscriptInteger(exponent)}`;
  }

  function formatMatrixNumber(value) {
    if (!Number.isFinite(value) || Math.abs(value) < 1e-12) return '0';
    const abs = Math.abs(value);
    if (abs >= 0.001 && abs < 1e6) {
      return Number(value.toFixed(6)).toString();
    }
    return scientificText(value, 3);
  }

  function formatEquationResistance(value) {
    if (!Number.isFinite(value)) return '— Ω';
    const abs = Math.abs(value);
    if (abs >= 1e6) return `${formatNumber(value / 1e6)} MΩ`;
    if (abs >= 1e3) return `${formatNumber(value / 1e3)} kΩ`;
    return `${formatNumber(value)} Ω`;
  }

  function rootVariable(root, measurements, html = false) {
    if (root === measurements.groundRoot) return '0';
    const index = measurements.nodeIndex.get(root);
    return html ? `V<sub>${index + 1}</sub>` : `V${index + 1}`;
  }

  function rootVoltage(root, measurements) {
    if (root === measurements.groundRoot) return 0;
    return measurements.solution[measurements.nodeIndex.get(root)];
  }

  function terminalRoot(ref, measurements) {
    return measurements.uf.find(ref);
  }

  function addSignedTerm(terms, sign, text) {
    terms.push({ sign: sign >= 0 ? 1 : -1, text });
  }

  function joinSignedTerms(terms) {
    if (!terms.length) return '0';
    return terms.map((term, index) => {
      const prefix = index === 0
        ? (term.sign < 0 ? '− ' : '')
        : (term.sign < 0 ? ' − ' : ' + ');
      return prefix + term.text;
    }).join('');
  }

  function buildNodalSolution(measurements) {
    const resistors = state.components.filter(c => c.type === 'resistor');
    const sources = state.components.filter(c => c.type === 'voltage');
    const allNodeRoots = measurements.nonGroundRoots;

    // ----------------------------------------------------------
    // A source connected directly to ground gives a KNOWN node
    // voltage immediately. Example:
    //   + of 1 V source at V1, - at GND  =>  V1 = 1 V
    // There is no reason to keep a symbol such as "Vs" in the
    // student's worked solution.
    // ----------------------------------------------------------
    const knownVoltage = new Map();
    knownVoltage.set(measurements.groundRoot, 0);

    const groundedSourceNotes = [];
    const floatingSources = [];

    sources.forEach((source, sourceIndex) => {
      const rp = terminalRoot(terminalRef(source.id, 'positive'), measurements);
      const rn = terminalRoot(terminalRef(source.id, 'negative'), measurements);

      if (rn === measurements.groundRoot && rp !== measurements.groundRoot) {
        knownVoltage.set(rp, source.value);
        groundedSourceNotes.push({
          root: rp,
          value: source.value,
          sourceIndex: sourceIndex + 1
        });
      } else if (rp === measurements.groundRoot && rn !== measurements.groundRoot) {
        knownVoltage.set(rn, -source.value);
        groundedSourceNotes.push({
          root: rn,
          value: -source.value,
          sourceIndex: sourceIndex + 1
        });
      } else if (rp !== measurements.groundRoot && rn !== measurements.groundRoot) {
        floatingSources.push({ source, sourceIndex: sourceIndex + 1, rp, rn });
      }
    });

    const nodeNumber = root => {
      if (root === measurements.groundRoot) return 0;
      return measurements.nodeIndex.get(root) + 1;
    };

    const nodeSymbol = (root, html = false) => {
      if (root === measurements.groundRoot) return '0';
      const n = nodeNumber(root);
      return html ? `V<sub>${n}</sub>` : `V${n}`;
    };

    const valueOrSymbol = (root, html = false) => {
      if (knownVoltage.has(root)) {
        return `${formatNumber(knownVoltage.get(root))} V`;
      }
      return nodeSymbol(root, html);
    };

    const unknownRoots = allNodeRoots.filter(root => !knownVoltage.has(root));

    // ----------------------------------------------------------
    // Standard nodal equations for circuits whose ideal voltage
    // sources are ground-referenced.
    // ----------------------------------------------------------
    const kclRows = unknownRoots.map(root => {
      const symbolic = [];
      const substituted = [];

      resistors.forEach(r => {
        const ra = terminalRoot(terminalRef(r.id, 'a'), measurements);
        const rb = terminalRoot(terminalRef(r.id, 'b'), measurements);
        if (ra !== root && rb !== root) return;

        const other = ra === root ? rb : ra;
        const vi = nodeSymbol(root, true);
        const vjSymbol = nodeSymbol(other, true);
        const vjValue = valueOrSymbol(other, true);

        addSignedTerm(symbolic, 1, `(${vi} − ${vjSymbol})/${r.name}`);
        addSignedTerm(
          substituted,
          1,
          `(${vi} − ${vjValue})/(${formatEquationResistance(r.value)})`
        );
      });

      return {
        node: nodeNumber(root),
        symbolic: `${joinSignedTerms(symbolic)} = 0`,
        substituted: `${joinSignedTerms(substituted)} = 0`
      };
    });

    // Build a classroom-style conductance matrix for the UNKNOWN
    // node voltages when no floating voltage source requires a
    // supernode/MNA treatment.
    let classroomMatrix = [];
    let classroomVector = [];
    let classroomVariables = [];
    let useMnaFallback = floatingSources.length > 0;

    if (!useMnaFallback && unknownRoots.length) {
      const idx = new Map(unknownRoots.map((root, i) => [root, i]));
      const n = unknownRoots.length;
      classroomMatrix = Array.from({ length: n }, () => Array(n).fill(0));
      classroomVector = Array(n).fill(0);
      classroomVariables = unknownRoots.map(root => `V${nodeNumber(root)}`);

      resistors.forEach(r => {
        const ra = terminalRoot(terminalRef(r.id, 'a'), measurements);
        const rb = terminalRoot(terminalRef(r.id, 'b'), measurements);
        const g = 1 / r.value;

        const stampSide = (self, other) => {
          if (!idx.has(self)) return;
          const i = idx.get(self);
          classroomMatrix[i][i] += g;

          if (idx.has(other)) {
            classroomMatrix[i][idx.get(other)] -= g;
          } else if (knownVoltage.has(other)) {
            classroomVector[i] += g * knownVoltage.get(other);
          }
        };

        stampSide(ra, rb);
        stampSide(rb, ra);
      });
    }

    // ----------------------------------------------------------
    // Solved node voltages
    // ----------------------------------------------------------
    const nodeAnswers = allNodeRoots.map(root => {
      const n = nodeNumber(root);
      const value = rootVoltage(root, measurements);
      const given = knownVoltage.has(root) ? ' (given directly by the source)' : '';
      return `V${n} = ${formatNumber(value)} V${given}`;
    });

    // ----------------------------------------------------------
    // Branch voltage/current calculations
    // ----------------------------------------------------------
    const branchWork = [];

    resistors.forEach(r => {
      const ra = terminalRoot(terminalRef(r.id, 'a'), measurements);
      const rb = terminalRoot(terminalRef(r.id, 'b'), measurements);
      const va = rootVoltage(ra, measurements);
      const vb = rootVoltage(rb, measurements);
      const voltage = va - vb;
      const current = voltage / r.value;

      const aName = ra === measurements.groundRoot ? 'GND' : nodeSymbol(ra);
      const bName = rb === measurements.groundRoot ? 'GND' : nodeSymbol(rb);

      branchWork.push(`
        <div class="worked-branch">
          <strong>${r.name}</strong><br>
          Voltage across ${r.name}:<br>
          V<sub>${r.name}</sub> = ${aName} − ${bName}
          = ${formatNumber(va)} V − ${formatNumber(vb)} V
          = <strong>${formatNumber(voltage)} V</strong><br><br>
          Current through ${r.name}:<br>
          I<sub>${r.name}</sub> = V<sub>${r.name}</sub> / ${r.name}<br>
          I<sub>${r.name}</sub> =
          ${formatNumber(voltage)} V / ${formatEquationResistance(r.value)}
          = <strong>${formatCurrent(current)}</strong>
        </div>
      `);
    });

    sources.forEach((s, k) => {
      const current = measurements.solution[measurements.nodeCount + k];
      branchWork.push(`
        <div class="worked-branch">
          <strong>Voltage source ${sources.length > 1 ? k + 1 : ''}</strong><br>
          Given voltage = <strong>${formatNumber(s.value)} V</strong><br>
          Source current = <strong>${formatCurrent(current)}</strong>
        </div>
      `);
    });

    // ----------------------------------------------------------
    // Step 1: clearly show which voltages are already GIVEN.
    // ----------------------------------------------------------
    const givenNodeHtml = groundedSourceNotes.map(info => {
      const n = nodeNumber(info.root);
      return `
        <div class="worked-branch">
          <strong>Given source: ${formatNumber(Math.abs(info.value))} V</strong><br>
          Because one terminal of the source is connected to GND,
          the connected node voltage is known immediately:<br>
          <strong>V<sub>${n}</sub> = ${formatNumber(info.value)} V</strong>
        </div>
      `;
    }).join('');

    const unknownNodeHtml = unknownRoots.map(root => `
      <div class="math-line">
        V<sub>${nodeNumber(root)}</sub> = unknown
      </div>
    `).join('');

    // ----------------------------------------------------------
    // Matrix section
    // ----------------------------------------------------------
    let matrixSection;

    if (useMnaFallback) {
      const variables = [
        ...allNodeRoots.map(root => `V${nodeNumber(root)}`),
        ...sources.map((_, i) => `Is${i + 1}`)
      ];

      matrixSection = `
        <div class="note">
          A voltage source exists between two non-ground nodes, so a
          <strong>supernode / Modified Nodal Analysis</strong> form is required.
          The source voltage is still substituted numerically; it is not treated
          as an unknown "Vs".
        </div>
        ${matrixHtml(measurements.matrix, measurements.vector, variables)}
      `;
    } else if (!unknownRoots.length) {
      matrixSection = `
        <div class="worked-branch">
          <strong>No simultaneous matrix is needed for this circuit.</strong><br>
          All non-ground node voltages are already fixed directly by the
          grounded voltage source(s). Continue to Ohm's law to obtain the currents.
        </div>
      `;
    } else {
      matrixSection = `
        <div class="note">
          Arrange only the unknown node-voltage equations in the form
          <strong>G · V = I</strong>.
        </div>
        ${matrixHtml(classroomMatrix, classroomVector, classroomVariables)}
      `;
    }

    const html = `
      <div class="solution-summary">
        <strong>Complete Nodal Analysis</strong><br>
        Use the source voltages as <strong>given numerical values</strong>.
        We only solve for node voltages that are actually unknown.
      </div>

      <div class="solution-step">
        <div class="step-title"><span class="step-number">1</span>Choose ground and identify known/unknown node voltages</div>
        <div class="math-line note">GND = 0 V</div>
        ${givenNodeHtml}
        ${unknownNodeHtml || ''}
      </div>

      <div class="solution-step">
        <div class="step-title"><span class="step-number">2</span>Write KCL only at the unknown nodes</div>
        <div class="note">
          For each resistor branch:
          I = (V<sub>node</sub> − V<sub>other</sub>) / R.
          If the other node voltage is already given by a source, plug that
          numerical voltage directly into the equation.
        </div>
        ${kclRows.length
          ? kclRows.map(row => `
              <div style="margin-top:12px"><strong>KCL at V${row.node}</strong></div>
              <div class="math-line">${row.symbolic}</div>
              <div class="note">Substitute the given values:</div>
              <div class="math-line">${row.substituted}</div>
            `).join('')
          : `<div class="worked-branch">
               There is no unknown node that needs a KCL equation in this circuit.
             </div>`}
        ${floatingSources.map(info => `
          <div class="worked-branch">
            <strong>Floating voltage source ${info.sourceIndex}</strong><br>
            ${nodeSymbol(info.rp, true)} − ${nodeSymbol(info.rn, true)}
            = ${formatNumber(info.source.value)} V
          </div>
        `).join('')}
      </div>

      <div class="solution-step">
        <div class="step-title"><span class="step-number">3</span>Arrange the unknown equations in matrix form</div>
        ${matrixSection}
      </div>

      <div class="solution-step">
        <div class="step-title"><span class="step-number">4</span>State the node-voltage answers</div>
        <div class="answer-grid">
          ${nodeAnswers.map(answer => `<div class="answer-chip">${answer}</div>`).join('')}
        </div>
      </div>

      <div class="solution-step">
        <div class="step-title"><span class="step-number">5</span>Calculate the voltage and current of every branch</div>
        <div class="note">
          Once the node voltages are known, use voltage difference and Ohm's law.
        </div>
        ${branchWork.join('')}
      </div>
    `;

    return {
      method: 'nodal',
      title: 'Nodal Analysis · Complete Solution',
      html
    };
  }

  function branchGraph(measurements) {
    const branches = [];
    state.components.forEach(component => {
      if (component.type === 'resistor') {
        const aRef = terminalRef(component.id, 'a');
        const bRef = terminalRef(component.id, 'b');
        branches.push({
          component,
          kind: 'resistor',
          n1: terminalRoot(aRef, measurements),
          n2: terminalRoot(bRef, measurements),
          resistance: component.value,
          sourceVoltage: 0
        });
      }
      if (component.type === 'voltage') {
        const pRef = terminalRef(component.id, 'positive');
        const nRef = terminalRef(component.id, 'negative');
        branches.push({
          component,
          kind: 'voltage',
          n1: terminalRoot(pRef, measurements),
          n2: terminalRoot(nRef, measurements),
          resistance: 0,
          sourceVoltage: component.value
        });
      }
    });
    return branches;
  }

  function nodeCenter(root, measurements) {
    const node = measurements.nodes.find(n => n.root === root);
    if (!node || !node.points.length) {
      return { x: canvas.clientWidth / 2, y: canvas.clientHeight / 2 };
    }
    return {
      x: node.points.reduce((s, p) => s + p.x, 0) / node.points.length,
      y: node.points.reduce((s, p) => s + p.y, 0) / node.points.length
    };
  }

  function polygonArea(points) {
    if (points.length < 3) return 0;
    let total = 0;
    for (let i = 0; i < points.length; i++) {
      const a = points[i];
      const b = points[(i + 1) % points.length];
      total += a.x * b.y - b.x * a.y;
    }
    return total / 2;
  }

  function graphComponentCount(nodes, branches) {
    const uf = new UnionFind(nodes);
    branches.forEach(branch => {
      if (branch.n1 !== branch.n2) uf.union(branch.n1, branch.n2);
    });
    return new Set(nodes.map(n => uf.find(n))).size;
  }

  function enumerateSimpleCycles(measurements, branches) {
    const nodes = [...new Set(branches.flatMap(b => [b.n1, b.n2]))];
    const adjacency = new Map(nodes.map(n => [n, []]));

    branches.forEach((branch, edgeIndex) => {
      adjacency.get(branch.n1)?.push({ to: branch.n2, edgeIndex });
      adjacency.get(branch.n2)?.push({ to: branch.n1, edgeIndex });
    });

    const found = new Map();
    const MAX_CYCLES = 500;

    function recordCycle(start, pathEdges, pathNodes, closingEdge, closingFrom) {
      const edgeIndices = [...pathEdges, closingEdge];
      const key = [...edgeIndices].sort((a, b) => a - b).join(',');
      if (found.has(key)) return;

      const coefficients = Array(branches.length).fill(0);
      const visualPoints = [];

      for (let i = 0; i < edgeIndices.length; i++) {
        const edgeIndex = edgeIndices[i];
        const branch = branches[edgeIndex];
        const from = i < pathEdges.length ? pathNodes[i] : closingFrom;
        const to = i < pathEdges.length ? pathNodes[i + 1] : start;

        coefficients[edgeIndex] =
          branch.n1 === from && branch.n2 === to ? 1 : -1;

        if (i === 0) visualPoints.push(nodeCenter(from, measurements));
        visualPoints.push({ x: branch.component.x, y: branch.component.y });
        visualPoints.push(nodeCenter(to, measurements));
      }

      // Screen coordinates use y-down. Positive shoelace area is clockwise.
      if (polygonArea(visualPoints) < 0) {
        for (let i = 0; i < coefficients.length; i++) coefficients[i] *= -1;
        visualPoints.reverse();
      }

      found.set(key, {
        coefficients,
        visualPoints,
        branchIndices: edgeIndices,
        area: Math.abs(polygonArea(visualPoints))
      });
    }

    nodes.forEach(start => {
      const visitedNodes = new Set([start]);
      const usedEdges = new Set();

      function dfs(current, pathEdges, pathNodes) {
        if (found.size >= MAX_CYCLES) return;

        for (const item of adjacency.get(current) || []) {
          const { to, edgeIndex } = item;
          if (usedEdges.has(edgeIndex)) continue;

          // Close a cycle. Two-edge cycles are valid in parallel-branch circuits.
          if (to === start && pathEdges.length >= 1) {
            recordCycle(start, pathEdges, pathNodes, edgeIndex, current);
            continue;
          }

          if (visitedNodes.has(to)) continue;

          usedEdges.add(edgeIndex);
          visitedNodes.add(to);
          dfs(to, [...pathEdges, edgeIndex], [...pathNodes, to]);
          visitedNodes.delete(to);
          usedEdges.delete(edgeIndex);
        }
      }

      dfs(start, [], [start]);
    });

    return [...found.values()];
  }

  function addIndependentCycleGF2(candidate, basis) {
    const vector = candidate.branchIndices.reduce((v, index) => {
      v[index] = 1;
      return v;
    }, Array(candidate.coefficients.length).fill(0));

    for (const row of basis) {
      if (!vector[row.pivot]) continue;
      for (let i = row.pivot; i < vector.length; i++) {
        vector[i] ^= row.vector[i];
      }
    }

    const pivot = vector.findIndex(v => v === 1);
    if (pivot < 0) return false;

    // Keep the basis in pivot order for deterministic reduction.
    const newRow = { pivot, vector };
    basis.push(newRow);
    basis.sort((a, b) => a.pivot - b.pivot);
    return true;
  }

  function buildPlanarMeshCycles(measurements, branches) {
    const nodes = [...new Set(branches.flatMap(b => [b.n1, b.n2]))];
    const componentCount = graphComponentCount(nodes, branches);
    const requiredCycleCount = branches.length - nodes.length + componentCount;

    if (requiredCycleCount <= 0) return [];

    const candidates = enumerateSimpleCycles(measurements, branches)
      .filter(cycle => cycle.area > 1)
      // Actual visible meshes are normally the smallest bounded independent cycles.
      .sort((a, b) => a.area - b.area || a.branchIndices.length - b.branchIndices.length);

    const selected = [];
    const basis = [];

    for (const candidate of candidates) {
      if (addIndependentCycleGF2(candidate, basis)) {
        selected.push(candidate);
        if (selected.length === requiredCycleCount) break;
      }
    }

    // Fallback: if the drawing is non-planar/degenerate and the minimum-face
    // selection cannot reach the graph cycle rank, use any remaining
    // independent simple cycles so the solver still works.
    if (selected.length < requiredCycleCount) {
      for (const candidate of candidates) {
        if (selected.includes(candidate)) continue;
        if (addIndependentCycleGF2(candidate, basis)) {
          selected.push(candidate);
          if (selected.length === requiredCycleCount) break;
        }
      }
    }

    return selected;
  }

  function meshExpressionForBranch(branchIndex, cycles) {
    const pieces = [];
    cycles.forEach((cycle, meshIndex) => {
      const c = cycle.coefficients[branchIndex];
      if (!c) return;
      pieces.push({ sign: c, text: `I${meshIndex + 1}` });
    });
    const joined = joinSignedTerms(pieces);
    return pieces.length > 1 ? `(${joined})` : joined;
  }

  function buildMeshSolution(measurements) {
    const branches = branchGraph(measurements);
    if (!branches.length) throw new Error('Mesh analysis needs resistor/source branches.');

    const cycles = buildPlanarMeshCycles(measurements, branches);
    if (!cycles.length) {
      throw new Error('No closed mesh was found. Mesh analysis requires at least one closed planar loop.');
    }

    const m = cycles.length;
    const Z = Array.from({ length: m }, () => Array(m).fill(0));
    const rhs = Array(m).fill(0);

    for (let l = 0; l < m; l++) {
      for (let k = 0; k < m; k++) {
        Z[l][k] = branches.reduce((sum, branch, b) => {
          if (branch.kind !== 'resistor') return sum;
          return sum +
            branch.resistance *
            cycles[l].coefficients[b] *
            cycles[k].coefficients[b];
        }, 0);
      }

      rhs[l] = -branches.reduce((sum, branch, b) => {
        if (branch.kind !== 'voltage') return sum;
        return sum + cycles[l].coefficients[b] * branch.sourceVoltage;
      }, 0);
    }

    const meshCurrents = gaussianSolve(Z, rhs);
    const branchCurrents = branches.map((branch, b) =>
      cycles.reduce((sum, cycle, k) =>
        sum + cycle.coefficients[b] * meshCurrents[k], 0)
    );

    const rawEquations = cycles.map((cycle, loopIndex) => {
      const terms = [];
      branches.forEach((branch, b) => {
        const c = cycle.coefficients[b];
        if (!c) return;
        if (branch.kind === 'resistor') {
          const currentExpr = meshExpressionForBranch(b, cycles);
          addSignedTerm(
            terms,
            c,
            `${branch.component.name}·${currentExpr}`
          );
        } else {
          addSignedTerm(
            terms,
            c,
            `${formatNumber(branch.sourceVoltage)} V`
          );
        }
      });
      return `Mesh ${loopIndex + 1}: ${joinSignedTerms(terms)} = 0`;
    });

    const simplified = Z.map((row, i) => {
      const terms = row.map((value, k) => ({ sign: value >= 0 ? 1 : -1, value: Math.abs(value), k }))
        .filter(term => term.value > 1e-12)
        .map(term => ({ sign: term.sign, text: `${formatNumber(term.value)}·I${term.k + 1}` }));
      return `${joinSignedTerms(terms)} = ${formatNumber(rhs[i])}`;
    });

    const branchAnswers = branches.map((branch, b) => {
      const current = branchCurrents[b];
      const actual = measurements.components[branch.component.id]?.current;
      let relation;

      if (branch.kind === 'resistor') {
        const voltage = current * branch.resistance;
        relation =
          `<strong>${branch.component.name}</strong>: ` +
          `${meshExpressionForBranch(b, cycles)} = ${formatCurrent(current)}<br>` +
          `${branch.component.name}: V = I·R = ${formatCurrent(current)} × ${formatNumber(branch.resistance)} Ω = ${formatNumber(voltage)} V`;
      } else {
        const sourceNumber =
          branches.filter(item => item.kind === 'voltage').indexOf(branch) + 1;
        const sourceLabel =
          branches.filter(item => item.kind === 'voltage').length > 1
            ? `Voltage source ${sourceNumber}`
            : 'Voltage source';

        relation =
          `<strong>${sourceLabel}</strong>: given V = ${formatNumber(branch.sourceVoltage)} V<br>` +
          `${sourceLabel}: current = ${formatCurrent(current)}`;
      }

      const compare = Number.isFinite(actual)
        ? ` <span class="note">(solver check: ${formatCurrent(actual)})</span>`
        : '';
      return relation + compare;
    });

    let maxDifference = 0;
    branches.forEach((branch, b) => {
      const actual = measurements.components[branch.component.id]?.current;
      if (Number.isFinite(actual)) {
        maxDifference = Math.max(maxDifference, Math.abs(actual - branchCurrents[b]));
      }
    });

    const variables = cycles.map((_, i) => `I${i + 1}`);

    const html = `
      <div class="solution-summary">
        <strong>Complete Mesh Analysis</strong><br>
        Independent meshes/loops detected: ${cycles.length}<br>
        The program forms KVL equations from the circuit you actually built and substitutes each given source voltage directly.<br>
        Mesh currents are assumed clockwise whenever the drawn geometry permits it.<br>
        A negative answer means the real current is opposite the assumed loop direction.
      </div>

      <div class="solution-step">
        <div class="step-title"><span class="step-number">1</span>Assign the mesh currents</div>
        ${cycles.map((_, i) => `<div class="math-line note">Mesh ${i + 1}: assume ↻ I${i + 1}</div>`).join('')}
      </div>

      <div class="solution-step">
        <div class="step-title"><span class="step-number">2</span>Apply KVL around each independent loop</div>
        ${rawEquations.map(eq => `<div class="math-line">${eq}</div>`).join('')}
        <div style="margin-top:9px"><strong>Simplified equations</strong></div>
        ${simplified.map(eq => `<div class="math-line">${eq}</div>`).join('')}
      </div>

      <div class="solution-step">
        <div class="step-title"><span class="step-number">3</span>Write the mesh equations in matrix form</div>
        <div class="math-line note">Z · I = V</div>
        ${matrixHtml(Z, rhs, variables)}
      </div>

      <div class="solution-step">
        <div class="step-title"><span class="step-number">4</span>Solve the mesh currents</div>
        <div class="answer-grid">
          ${meshCurrents.map((value, i) => `<div class="answer-chip">I${i + 1} = ${formatCurrent(value)}</div>`).join('')}
        </div>
      </div>

      <div class="solution-step">
        <div class="step-title"><span class="step-number">5</span>Find the actual branch voltages and currents</div>
        ${branchAnswers.map(answer => `<div class="math-line">${answer}</div>`).join('')}
      </div>

      <div class="solution-step">
        <div class="step-title"><span class="step-number">6</span>Verify against the circuit solver</div>
        <div class="math-line result">Maximum mesh-vs-MNA branch-current difference = ${maxDifference.toExponential(3)} A</div>
      </div>
    `;

    return {
      method: 'mesh',
      title: 'Mesh Analysis · Complete Solution',
      html,
      cycles,
      meshCurrents,
      branchCurrents,
      matrix: Z,
      vector: rhs
    };
  }

  function openSolutionPanel() {
    if (!state.analysisData) return;
    solutionPanel.classList.add('open');
    document.getElementById('app').classList.add('solution-open');
    solutionToggleBtn.classList.remove('available');

    requestAnimationFrame(() => {
      if (!state.view.userAdjusted && !isMobileLayout()) fitCircuit(false);
      else render();
    });
  }

  function closeSolutionPanel() {
    solutionPanel.classList.remove('open');
    document.getElementById('app').classList.remove('solution-open');

    if (state.analysisData) {
      solutionToggleBtn.classList.add('available');
    }

    requestAnimationFrame(() => {
      if (!state.view.userAdjusted) fitCircuit(false);
      else render();
    });
  }

  function renderSolution() {
    if (!state.analysisData) {
      solutionPanel.classList.remove('open');
      document.getElementById('app').classList.remove('solution-open');
      solutionToggleBtn.classList.remove('available');
      solutionContent.innerHTML = '';
      return;
    }

    solutionTitle.textContent = state.analysisData.title;
    solutionContent.innerHTML = state.analysisData.html;

    const alreadyOpen = solutionPanel.classList.contains('open');

    if (!isMobileLayout()) {
      openSolutionPanel();
    } else if (alreadyOpen) {
      solutionToggleBtn.classList.remove('available');
    } else {
      solutionPanel.classList.remove('open');
      document.getElementById('app').classList.remove('solution-open');
      solutionToggleBtn.classList.add('available');
    }
  }

  function renderWirePreview() {
    const start = terminalPosition(state.wireDrag.start);
    if (!start) return;
    const end = { x: snap(state.pointer.x), y: snap(state.pointer.y) };
    const path = svg('polyline', {
      points: pointsString(routeWire(start, end)),
      class: 'wire-preview'
    });
    overlayLayer.appendChild(path);
  }

  function renderInspector() {
    if (!state.selected) {
      inspector.classList.remove('open');
      inspector.innerHTML = '';
      return;
    }

    if (state.selected.kind === 'wire') {
      const wire = state.wires.find(w => w.id === state.selected.id);
      if (!wire) { state.selected = null; return renderInspector(); }
      inspector.classList.add('open');
      inspector.innerHTML = `
        <h3>Wire ${wire.id}</h3>
        <div style="color:var(--muted);font-size:13px;line-height:1.5">Ideal conductor. Wire crossings are not junctions unless the wires share the same terminal.</div>
        <button id="wireDeleteBtn" style="width:100%;margin-top:12px">Delete wire</button>
      `;
      document.getElementById('wireDeleteBtn').addEventListener('click', deleteSelected);
      return;
    }

    const component = getComponent(state.selected.id);
    if (!component) { state.selected = null; return renderInspector(); }
    inspector.classList.add('open');

    const unit = component.type === 'resistor' ? 'Ω' : component.type === 'voltage' ? 'V' : '';
    const valueField = component.type === 'ground' ? '' : `
      <div class="field">
        <label>Value (${unit})</label>
        <input id="valueInput" type="number" step="any" min="${component.type === 'resistor' ? '0.001' : '-1000000'}" value="${component.value}">
