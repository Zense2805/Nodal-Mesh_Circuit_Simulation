      </div>
    `;

    const measurement = state.measurements?.components?.[component.id];
    const measurementHtml = measurement ? `
      <div class="measurement-card">
        <div class="v">V = ${formatNumber(measurement.voltage)} V</div>
        <div class="i">I = ${formatCurrent(measurement.current)}</div>
      </div>
    ` : '';

    inspector.innerHTML = `
      <h3>${component.type === 'voltage' ? `Voltage Source · ${formatNumber(component.value)} V` : component.name + ' · ' + component.type}</h3>
      ${valueField}
      <div class="inspector-actions">
        <button id="rotateBtn">Rotate 90°</button>
        <button id="deleteBtn">Delete</button>
      </div>
      ${measurementHtml}
    `;

    const valueInput = document.getElementById('valueInput');
    if (valueInput) {
      valueInput.addEventListener('change', () => {
        const next = Number(valueInput.value);
        const valid = Number.isFinite(next) && (component.type === 'voltage' || next > 0);
        if (!valid) {
          valueInput.value = component.value;
          setStatus('Invalid component value.', 'error');
          return;
        }
        snapshot();
        component.value = next;
        if (state.running) runSimulation(); else render();
      });
    }

    document.getElementById('rotateBtn').addEventListener('click', rotateSelected);
    document.getElementById('deleteBtn').addEventListener('click', deleteSelected);
  }

  function rotateSelected() {
    if (!state.selected || state.selected.kind !== 'component') return;
    const c = getComponent(state.selected.id);
    if (!c || c.type === 'ground') return;
    snapshot();
    c.rotation = ((c.rotation || 0) + 90) % 360;
    stopSimulation(false);
    render();
  }

  function deleteSelected() {
    if (!state.selected) return;
    snapshot();
    if (state.selected.kind === 'wire') {
      state.wires = state.wires.filter(w => w.id !== state.selected.id);
    } else {
      const prefix = `${state.selected.id}:`;
      state.components = state.components.filter(c => c.id !== state.selected.id);
      state.wires = state.wires.filter(w => !w.a.startsWith(prefix) && !w.b.startsWith(prefix));
    }
    renumberVoltageSources();
    state.selected = null;
    stopSimulation(false);
    render();
    setStatus('Deleted.');
  }

  function pointerToCanvas(event) {
    const screen = screenPoint(event);
    return screenToWorld(screen.x, screen.y);
  }

  canvas.addEventListener('pointerdown', event => {
    const sp = screenPoint(event);
    state.activePointers.set(event.pointerId, sp);

    if (state.activePointers.size >= 2) {
      event.preventDefault();
      try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
      beginPinchIfReady();
      return;
    }

    const terminal = event.target.closest?.('[data-terminal-ref]');
    if (terminal) {
      event.preventDefault();
      state.pointer = pointerToCanvas(event);
      state.wireDrag = { start: terminal.dataset.terminalRef, pointerId: event.pointerId };
      canvas.setPointerCapture(event.pointerId);
      render();
      setStatus('Drag to another green terminal to connect.');
      return;
    }

    const wireHit = event.target.closest?.('[data-wire-id]');
    if (wireHit) {
      state.selected = { kind: 'wire', id: wireHit.dataset.wireId };
      render();
      return;
    }

    const componentHit = event.target.closest?.('[data-component-id]');
    if (componentHit) {
      const c = getComponent(componentHit.dataset.componentId);
      if (!c) return;
      state.selected = { kind: 'component', id: c.id };
      const p = pointerToCanvas(event);
      snapshot();
      state.drag = {
        id: c.id,
        pointerId: event.pointerId,
        offsetX: p.x - c.x,
        offsetY: p.y - c.y
      };
      canvas.setPointerCapture(event.pointerId);
      renderInspector();
      return;
    }

    state.selected = null;

    const screen = screenPoint(event);
    state.panDrag = {
      pointerId: event.pointerId,
      startX: screen.x,
      startY: screen.y,
      panX: state.view.panX,
      panY: state.view.panY
    };

    canvas.classList.add('pan-cursor');
    canvas.setPointerCapture(event.pointerId);
    render();
  });

  canvas.addEventListener('pointermove', event => {
    const sp = screenPoint(event);
    if (state.activePointers.has(event.pointerId)) {
      state.activePointers.set(event.pointerId, sp);
    }

    if (state.pinch && state.activePointers.size >= 2) {
      updatePinch();
      return;
    }

    state.pointer = pointerToCanvas(event);

    if (state.panDrag && state.panDrag.pointerId === event.pointerId) {
      const screen = screenPoint(event);
      state.view.panX =
        state.panDrag.panX + (screen.x - state.panDrag.startX);
      state.view.panY =
        state.panDrag.panY + (screen.y - state.panDrag.startY);
      state.view.userAdjusted = true;
      applyViewportTransform();
      return;
    }

    if (state.wireDrag && state.wireDrag.pointerId === event.pointerId) {
      render();
      return;
    }
    if (state.drag && state.drag.pointerId === event.pointerId) {
      const c = getComponent(state.drag.id);
      if (!c) return;
      const p = state.pointer;
      c.x = snap(clamp(p.x - state.drag.offsetX, -5000, 5000));
      c.y = snap(clamp(p.y - state.drag.offsetY, -5000, 5000));
      stopSimulation(false);
      render();
    }
  });

  canvas.addEventListener('pointerup', event => {
    state.activePointers.delete(event.pointerId);

    if (state.pinch) {
      if (state.activePointers.size < 2) {
        state.pinch = null;
        canvas.classList.remove('pan-cursor');
      }
      return;
    }

    if (state.panDrag && state.panDrag.pointerId === event.pointerId) {
      state.panDrag = null;
      canvas.classList.remove('pan-cursor');
      return;
    }

    if (state.wireDrag && state.wireDrag.pointerId === event.pointerId) {
      const target = document.elementFromPoint(event.clientX, event.clientY);
      const terminal = target?.closest?.('[data-terminal-ref]');
      const start = state.wireDrag.start;
      state.wireDrag = null;
      if (terminal && terminal.dataset.terminalRef !== start) {
        connectTerminals(start, terminal.dataset.terminalRef);
      } else {
        render();
        setStatus('Wire cancelled. Drop on another green terminal.');
      }
      return;
    }
    if (state.drag && state.drag.pointerId === event.pointerId) {
      state.drag = null;
      render();
      setStatus('Component placed on grid.');
    }
  });

  canvas.addEventListener('pointercancel', () => {
    state.drag = null;
    state.wireDrag = null;
    state.panDrag = null;
    state.pinch = null;
    state.activePointers.clear();
    canvas.classList.remove('pan-cursor');
    render();
  });

  class UnionFind {
    constructor(items) {
      this.parent = new Map(items.map(x => [x, x]));
    }
    find(x) {
      if (!this.parent.has(x)) this.parent.set(x, x);
      const p = this.parent.get(x);
      if (p !== x) this.parent.set(x, this.find(p));
      return this.parent.get(x);
    }
    union(a, b) {
      const ra = this.find(a);
      const rb = this.find(b);
      if (ra !== rb) this.parent.set(rb, ra);
    }
  }

  function gaussianSolve(matrix, vector) {
    const n = vector.length;
    const a = matrix.map((row, i) => [...row, vector[i]]);
    for (let col = 0; col < n; col++) {
      let pivot = col;
      for (let row = col + 1; row < n; row++) {
        if (Math.abs(a[row][col]) > Math.abs(a[pivot][col])) pivot = row;
      }
      if (Math.abs(a[pivot][col]) < 1e-12) {
        throw new Error('Circuit is floating, open, or has conflicting ideal voltage sources. Check all connections and ground.');
      }
      [a[col], a[pivot]] = [a[pivot], a[col]];
      const div = a[col][col];
      for (let j = col; j <= n; j++) a[col][j] /= div;
      for (let row = 0; row < n; row++) {
        if (row === col) continue;
        const factor = a[row][col];
        for (let j = col; j <= n; j++) a[row][j] -= factor * a[col][j];
      }
    }
    return a.map(row => row[n]);
  }

  function solveDC() {
    if (!state.components.length) throw new Error('Add components first.');

    const allTerminals = state.components.flatMap(componentTerminalRefs);
    const uf = new UnionFind(allTerminals);
    state.wires.forEach(w => uf.union(w.a, w.b));

    const grounds = state.components.filter(c => c.type === 'ground');
    if (!grounds.length) throw new Error('Add at least one ground reference.');
    for (let i = 1; i < grounds.length; i++) {
      uf.union(terminalRef(grounds[0].id, 'gnd'), terminalRef(grounds[i].id, 'gnd'));
    }
    const groundRoot = uf.find(terminalRef(grounds[0].id, 'gnd'));

    const roots = [...new Set(allTerminals.map(t => uf.find(t)))];
    const nonGroundRoots = roots.filter(r => r !== groundRoot);
    const nodeIndex = new Map(nonGroundRoots.map((r, i) => [r, i]));
    const resistors = state.components.filter(c => c.type === 'resistor');
    const sources = state.components.filter(c => c.type === 'voltage');
    const nodeCount = nonGroundRoots.length;
    const size = nodeCount + sources.length;
    if (!size) throw new Error('Nothing to solve.');

    const A = Array.from({ length: size }, () => Array(size).fill(0));
    const z = Array(size).fill(0);

    const ni = ref => {
      const root = uf.find(ref);
      return root === groundRoot ? -1 : nodeIndex.get(root);
    };

    resistors.forEach(r => {
      if (!(r.value > 0)) throw new Error(`${r.name} must be greater than 0 Ω.`);
      const a = ni(terminalRef(r.id, 'a'));
      const b = ni(terminalRef(r.id, 'b'));
      const g = 1 / r.value;
      if (a >= 0) A[a][a] += g;
      if (b >= 0) A[b][b] += g;
      if (a >= 0 && b >= 0) {
        A[a][b] -= g;
        A[b][a] -= g;
      }
    });

    sources.forEach((s, k) => {
      const p = ni(terminalRef(s.id, 'positive'));
      const n = ni(terminalRef(s.id, 'negative'));
      const q = nodeCount + k;
      if (p >= 0) { A[p][q] += 1; A[q][p] += 1; }
      if (n >= 0) { A[n][q] -= 1; A[q][n] -= 1; }
      z[q] = s.value;
    });

    const solution = gaussianSolve(A, z);
    const nodeVoltage = ref => {
      const index = ni(ref);
      return index < 0 ? 0 : solution[index];
    };

    const componentMeasurements = {};
    const terminalEnteringCurrent = {};

    resistors.forEach(r => {
      const va = nodeVoltage(terminalRef(r.id, 'a'));
      const vb = nodeVoltage(terminalRef(r.id, 'b'));
      const v = va - vb;
      const i = v / r.value;
      componentMeasurements[r.id] = {
        voltage: v,
        current: i,
        arrow: i >= 0 ? '→' : '←'
      };
      terminalEnteringCurrent[terminalRef(r.id, 'a')] = i;
      terminalEnteringCurrent[terminalRef(r.id, 'b')] = -i;
    });

    sources.forEach((s, k) => {
      const i = solution[nodeCount + k];
      componentMeasurements[s.id] = {
        voltage: s.value,
        current: i,
        arrow: i >= 0 ? '↓' : '↑'
      };
      terminalEnteringCurrent[terminalRef(s.id, 'positive')] = i;
      terminalEnteringCurrent[terminalRef(s.id, 'negative')] = -i;
    });

    grounds.forEach(g => {
      componentMeasurements[g.id] = { voltage: 0, current: 0, arrow: '' };
    });

    const nodePoints = new Map();
    allTerminals.forEach(ref => {
      const root = uf.find(ref);
      if (!nodePoints.has(root)) nodePoints.set(root, []);
      const p = terminalPosition(ref);
      if (p) nodePoints.get(root).push(p);
    });

    const nodes = [];
    roots.forEach(root => {
      const voltage = root === groundRoot ? 0 : solution[nodeIndex.get(root)];
      nodes.push({ root, voltage, points: nodePoints.get(root) || [] });
    });

    return {
      components: componentMeasurements,
      terminalEnteringCurrent,
      nodes,
      uf,
      groundRoot,
      roots,
      nonGroundRoots,
      nodeIndex,
      nodeCount,
      matrix: A,
      vector: z,
      solution
    };
  }

  function getWireFlowInfo(wire) {
    const m = state.measurements;
    if (!m) return null;
    const ia = m.terminalEnteringCurrent[wire.a];
    const ib = m.terminalEnteringCurrent[wire.b];
    if (Number.isFinite(ia)) return { current: -ia };
    if (Number.isFinite(ib)) return { current: ib };
    return null;
  }

  function runSimulation() {
    try {
      state.measurements = solveDC();
      state.analysisData = state.analysisMethod === 'mesh'
        ? buildMeshSolution(state.measurements)
        : buildNodalSolution(state.measurements);

      state.running = true;
      runBtn.classList.add('running');
      runBtn.textContent = 'Ⅱ';

      renderSolution();
      render();

      requestAnimationFrame(() => {
        if (!state.view.userAdjusted) fitCircuit(false);
      });

      setStatus(
        `${state.analysisMethod === 'mesh' ? 'Mesh' : 'Nodal'} complete · live V/I shown`,
        'running'
      );
    } catch (error) {
      state.running = false;
      state.measurements = null;
      state.analysisData = null;
      runBtn.classList.remove('running');
      runBtn.textContent = '▶';
      renderSolution();
      render();

      requestAnimationFrame(() => {
        if (!state.view.userAdjusted) fitCircuit(false);
      });

      setStatus(error.message, 'error');
    }
  }

  function stopSimulation(showMessage = true, keepSolution = false) {
    state.running = false;
    state.measurements = null;
    if (!keepSolution) state.analysisData = null;
    runBtn.classList.remove('running');
    runBtn.textContent = '▶';
    if (!keepSolution) renderSolution();
    if (showMessage) setStatus('Simulation paused. Circuit remains editable.');
  }

  function toggleRun() {
    if (state.running) {
      stopSimulation(true, true);
      render();
      renderSolution();
    } else {
      runSimulation();
    }
  }

  function formatNumber(value) {
    if (!Number.isFinite(value) || Math.abs(value) < 1e-12) return '0';
    const abs = Math.abs(value);

    // Keep normal classroom values readable instead of showing 1.00e+3.
    if (abs >= 0.001 && abs < 1e6) {
      return Number(value.toFixed(3)).toString();
    }

    return scientificText(value, 2);
  }

  function formatVoltage(value) {
    if (!Number.isFinite(value)) return '— V';
    const abs = Math.abs(value);
    if (abs >= 1) return `${formatNumber(value)} V`;
    if (abs >= 1e-3) return `${formatNumber(value * 1e3)} mV`;
    if (abs >= 1e-6) return `${formatNumber(value * 1e6)} µV`;
    return `${scientificText(value, 2)} V`;
  }

  function formatCurrent(value) {
    if (!Number.isFinite(value)) return '—';
    const abs = Math.abs(value);
    if (abs >= 1) return `${formatNumber(value)} A`;
    if (abs >= 1e-3) return `${formatNumber(value * 1e3)} mA`;
    if (abs >= 1e-6) return `${formatNumber(value * 1e6)} µA`;
    return `${formatNumber(value * 1e9)} nA`;
  }

  function formatResistance(value) {
    const abs = Math.abs(value);
    if (abs >= 1e6) return `${formatNumber(value / 1e6)} MΩ`;
    if (abs >= 1e3) return `${formatNumber(value / 1e3)} kΩ`;
    return `${formatNumber(value)} Ω`;
  }

  document.getElementById('zoomInBtn').addEventListener('click', () => {
    zoomAtScreenPoint(
      state.view.zoom * 1.22,
      canvas.clientWidth / 2,
      (canvas.clientHeight - document.getElementById('bottomBar').offsetHeight) / 2
    );
  });

  document.getElementById('zoomOutBtn').addEventListener('click', () => {
    zoomAtScreenPoint(
      state.view.zoom / 1.22,
      canvas.clientWidth / 2,
      (canvas.clientHeight - document.getElementById('bottomBar').offsetHeight) / 2
    );
  });

  document.getElementById('fitViewBtn').addEventListener('click', () => {
    fitCircuit(true);
    setStatus('Circuit fitted to the visible workspace.');
  });

  canvas.addEventListener('wheel', event => {
    event.preventDefault();
    const screen = screenPoint(event);
    const factor = event.deltaY < 0 ? 1.12 : 1 / 1.12;
    zoomAtScreenPoint(
      state.view.zoom * factor,
      screen.x,
      screen.y
    );
  }, { passive: false });

  analysisSelector.addEventListener('click', event => {
    const button = event.target.closest('[data-analysis-method]');
    if (!button) return;
    const method = button.dataset.analysisMethod;
    if (method !== 'nodal' && method !== 'mesh') return;

    state.analysisMethod = method;
    analysisSelector.querySelectorAll('[data-analysis-method]').forEach(item => {
      item.classList.toggle('active', item.dataset.analysisMethod === method);
    });

    if (state.running) {
      runSimulation();
    } else {
      state.analysisData = null;
      renderSolution();
      setStatus(`${method === 'mesh' ? 'Mesh' : 'Nodal'} analysis selected. Press Run to generate the complete solution.`);
    }
  });

  document.getElementById('closeSolutionBtn').addEventListener('click', closeSolutionPanel);
  solutionToggleBtn.addEventListener('click', openSolutionPanel);

  document.getElementById('addBtn').addEventListener('click', () => palette.classList.toggle('open'));
  palette.addEventListener('click', event => {
    const button = event.target.closest('[data-add]');
    if (button) addComponent(button.dataset.add);
  });
  runBtn.addEventListener('click', toggleRun);
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('rotateBottomBtn').addEventListener('click', rotateSelected);
  document.getElementById('deleteBottomBtn').addEventListener('click', deleteSelected);
  document.getElementById('clearBtn').addEventListener('click', () => {
    if (!confirm('Clear the entire circuit?')) return;
    snapshot();
    state.components = [];
    state.wires = [];
    state.selected = null;
    stopSimulation(false);
    render();
    setStatus('Workspace cleared.');
  });

  document.addEventListener('keydown', event => {
    const tag = document.activeElement?.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (event.key === 'Delete' || event.key === 'Backspace') {
      event.preventDefault();
      deleteSelected();
    }
    if (event.key.toLowerCase() === 'r') rotateSelected();
    if (event.code === 'Space') {
      event.preventDefault();
      toggleRun();
    }
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') {
      event.preventDefault();
      undo();
    }
  });

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      renderSolution();
      if (!state.view.userAdjusted) fitCircuit(false);
      else render();
    }, 80);
  });

  function starterCircuit() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight - document.getElementById('bottomBar').offsetHeight;
    const cx = snap(w * 0.50);
    const cy = snap(h * 0.48);

    const source = { id: `c${state.nextComponent++}`, type: 'voltage', name: 'Vs', value: 1, x: cx - 144, y: cy, rotation: 0 };
    const resistor = { id: `c${state.nextComponent++}`, type: 'resistor', name: 'R1', value: 1000, x: cx + 144, y: cy, rotation: 90 };
    const ground = { id: `c${state.nextComponent++}`, type: 'ground', name: 'GND1', value: 0, x: cx + 144, y: cy + 144, rotation: 0 };
    state.components.push(source, resistor, ground);

    state.wires.push(
      { id: `w${state.nextWire++}`, a: terminalRef(source.id, 'positive'), b: terminalRef(resistor.id, 'a') },
      { id: `w${state.nextWire++}`, a: terminalRef(resistor.id, 'b'), b: terminalRef(ground.id, 'gnd') },
      { id: `w${state.nextWire++}`, a: terminalRef(ground.id, 'gnd'), b: terminalRef(source.id, 'negative') }
    );
    render();
    requestAnimationFrame(() => fitCircuit(false));
  }

  starterCircuit();
})();
</script>
</body>
</html>
